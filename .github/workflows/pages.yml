name: Publish GitHub Pages for manual acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inner-zoo-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ github.repository == 'zyrobbie/inner-zoo' &&
          !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ZOO_PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - name: Read exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build complete website from source
        run: npm run build
      - name: Verify frozen content and website files
        run: node qa-browser/scripts/preflight.cjs
      - name: Verify image export content
        run: node scripts/test-export.cjs
      - name: Verify bounded image export and retry states
        run: |
          node qa-browser/scripts/export-faults.cjs .
          node qa-browser/scripts/export-ui-faults.cjs .
      - name: Verify shared web and image result layout
        run: |
          node scripts/test-shared-layout.cjs
          node qa-browser/scripts/layout-independent.cjs .
      - name: Verify approved scoring with independent model tests
        run: node qa-browser/scripts/model-v05.cjs .
      - name: Upload structurally checked website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy for user acceptance
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read deployed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Rebuild reference bytes
        run: npm run build
      - name: Verify HTTPS status, release commit and all website file hashes
        run: npm run verify:live
      - name: Preserve exact live integrity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-integrity-${{ github.sha }}-${{ github.run_attempt }}
          path: qa-browser/artifacts/live-integrity.json
          if-no-files-found: warn
          retention-days: 7
