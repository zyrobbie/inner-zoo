name: Browser acceptance and GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inner-zoo-pages
  cancel-in-progress: false

jobs:
  browser:
    if: >-
      ${{ github.repository == 'zyrobbie/inner-zoo' &&
          !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      ZOO_PROJECT_ROOT: ${{ github.workspace }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/zoo-pw-browsers
    steps:
      - name: Read exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned browser test dependencies
        working-directory: qa-browser
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Build website from source
        run: npm run build
      - name: Verify scripts, content contract, assets and test inventory
        working-directory: qa-browser
        run: |
          npm run check:draft
          npm run preflight
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,playwright:require("@playwright/test/package.json").version})' > artifacts/runner-runtime.json
      - name: Install Chromium and WebKit
        working-directory: qa-browser
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Discover browser acceptance tests
        working-directory: qa-browser
        run: npm run test:list
      - name: Run candidate browser acceptance
        working-directory: qa-browser
        run: npm test
      - name: Keep synthetic browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: qa-browser/artifacts/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
      - name: Upload only the successfully tested website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: browser
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy tested website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      ZOO_PROJECT_ROOT: ${{ github.workspace }}
      ZOO_EXPECTED_COMMIT: ${{ github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/zoo-pw-browsers
    steps:
      - name: Read the deployed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned browser test dependencies
        working-directory: qa-browser
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Rebuild reference bytes for exact deployed commit
        run: npm run build
      - name: Verify HTTPS live commit and all website file hashes
        run: npm run verify:live
      - name: Install Chromium and WebKit
        working-directory: qa-browser
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Run real Pages browser smoke
        working-directory: qa-browser
        run: npm run test:live
      - name: Keep live verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: qa-browser/artifacts/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
